name: Build User & Admin APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-both-apks:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب ملفات المنصة من المستودع
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد بيئة Java JDK 17 للأندرويد
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. تثبيت الحزم وتحميل شعار التطبيق
        run: |
          npm install
          curl -L "https://e.top4top.io/p_3675vatut1.jpg" -o icon.jpg || true

      - name: 5. بناء النسخة الأولى - تطبيق المستخدم (Kaido-Follow.apk)
        run: |
          rm -rf android www
          mkdir -p www
          cp index.html www/index.html
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.kaido.follow",appName:"Kaido Follow",webDir:"www",bundledWebRuntime:false,server:{cleartext:true,allowNavigation:["*"]}}, null, 2))'
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          if [ -f icon.jpg ]; then find android/app/src/main/res -name "ic_launcher*.png" -exec cp icon.jpg {} \; || true; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Kaido-Follow.apk

      - name: 6. بناء النسخة الثانية - تطبيق الإدارة (Kaido-Admin.apk)
        run: |
          rm -rf android www
          mkdir -p www
          cp admin.html www/index.html
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.kaido.admin",appName:"Kaido Admin",webDir:"www",bundledWebRuntime:false,server:{cleartext:true,allowNavigation:["*"]}}, null, 2))'
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          if [ -f icon.jpg ]; then find android/app/src/main/res -name "ic_launcher*.png" -exec cp icon.jpg {} \; || true; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Kaido-Admin.apk

      - name: 7. رفع التطبيقين في قسم Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kaido-Both-APKs
          path: |
            Kaido-Follow.apk
            Kaido-Admin.apk

      - name: 8. نشر التطبيقين في قسم Releases للتحميل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "إصدار كايدو فولو (المستخدم + الأدمن) #${{ github.run_number }}"
          body: "اضغط على Kaido-Follow.apk لتحميل تطبيق المستخدم، أو Kaido-Admin.apk لتحميل تطبيق لوحة الإدارة."
          files: |
            Kaido-Follow.apk
            Kaido-Admin.apk
